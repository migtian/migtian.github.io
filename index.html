<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4c6ef5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="日程安排" />
<link rel="apple-touch-icon" href="icon-app-180.png?v=2" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-app-180.png?v=2" />
<link rel="apple-touch-icon" sizes="120x120" href="icon-app-120.png?v=2" />
<link rel="icon" type="image/svg+xml" href="icon-app.svg?v=2" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>日程安排</title>
<style>
  :root {
    --bg:#f6f7fb; --card:#ffffff; --text:#1f2430; --muted:#8a90a2;
    --border:#e7e9f0; --primary:#4c6ef5; --primary-soft:#eef2ff;
    --danger:#e03131; --ok:#12b886; --shadow:0 1px 3px rgba(17,24,39,.06),0 8px 24px rgba(17,24,39,.05);
  }
  body.dark { --bg:#15171e; --card:#1e212b; --text:#e6e8ee; --muted:#8b91a3; --border:#2b2f3a; --primary:#6d8bff; --primary-soft:#21263a; --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.5; padding:20px 14px 100px; -webkit-tap-highlight-color:transparent; overflow-x:hidden; }
  .wrap { max-width:760px; margin:0 auto; }
  header { text-align:center; margin-bottom:18px; }
  header h1 { font-size:26px; font-weight:800; letter-spacing:.5px; }
  header p { color:var(--muted); font-size:13px; margin-top:4px; }
  .tabbar { display:flex; gap:6px; justify-content:space-between; align-items:stretch; margin-bottom:18px; }
  .tab { border:1px solid var(--border); background:var(--card); border-radius:12px; padding:10px 6px; cursor:pointer; font-size:14px; font-weight:600; color:var(--muted); font-family:inherit; transition:all .15s; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; box-shadow:var(--shadow); flex:1; min-width:0; min-height:52px; }
  .tab:hover { border-color:var(--primary); color:var(--primary); }
  .tab.active { background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:0 6px 16px rgba(76,110,245,.3); }
  .icon-btns { display:flex; flex-direction:column; gap:6px; margin-left:4px; flex-shrink:0; }
  .icon-btn { border:1px solid var(--border); background:var(--card); border-radius:12px; padding:14px 8px; cursor:pointer; color:var(--text); display:inline-flex; align-items:center; justify-content:center; box-shadow:var(--shadow); min-height:52px; }
  .icon-btn:hover { background:var(--primary-soft); color:var(--primary); }
  .tab .ic, .icon-btn .ic { width:24px; height:24px; display:block; }
  .panel { display:none; }
  .panel.active { display:block; animation:fade .18s ease; }
  @keyframes fade { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:var(--shadow); margin-bottom:14px; }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .cal-search { display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:7px 10px; flex:1; min-width:140px; }
  .cal-search input { border:none; background:transparent; outline:none; color:var(--text); flex:1; font-family:inherit; font-size:14px; }
  .search { display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:7px 10px; flex:1; min-width:140px; }
  .search input { border:none; background:transparent; outline:none; color:var(--text); flex:1; font-size:14px; }
  .cs-clear, .search-clear { border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:18px; line-height:1; }
  .btn { border:1px solid var(--border); background:var(--card); border-radius:10px; padding:9px 14px; cursor:pointer; color:var(--text); font-family:inherit; font-size:14px; font-weight:600; transition:all .15s; }
  .btn:hover { border-color:var(--primary); color:var(--primary); }
  .btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
  .btn-primary:hover { filter:brightness(1.05); color:#fff; }
  .btn-sm { padding:6px 10px; font-size:13px; }
  .btn-ghost { background:transparent; }
  .mini { border:1px solid var(--border); background:var(--card); border-radius:8px; padding:4px 9px; cursor:pointer; font-size:12px; color:var(--muted); font-family:inherit; }
  .mini:hover { border-color:var(--primary); color:var(--primary); }
  .mini.del:hover { border-color:var(--danger); color:var(--danger); }
  input[type=text], input[type=date], input[type=url], input[type=email], input[type=password], select, textarea {
    width:100%; border:1px solid var(--border); border-radius:10px; padding:9px 11px; font-size:14px; font-family:inherit; background:var(--card); color:var(--text); outline:none; min-width:0; box-sizing:border-box;
  }
  input[type=date] { min-width:0; max-width:100%; padding:9px 11px; -webkit-appearance: none; appearance: none; }
  input:focus, select:focus, textarea:focus { border-color:var(--primary); }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:5px; }
  .field-row { display:flex; gap:8px; flex-wrap:wrap; }
  .field-row > .field { min-width:0; }
  .add-fab { position:fixed; right:18px; bottom:18px; z-index:50; border:none; background:var(--primary); color:#fff; width:56px; height:56px; border-radius:16px; font-size:24px; cursor:pointer; box-shadow:0 8px 24px rgba(76,110,245,.4); display:flex; align-items:center; justify-content:center; }
  .list { list-style:none; }
  .item { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:13px 14px; margin-bottom:10px; box-shadow:var(--shadow); display:flex; align-items:flex-start; gap:11px; }
  .item.done .item-title { text-decoration:line-through; color:var(--muted); }
  .chk { width:20px; height:20px; border:2px solid var(--border); border-radius:6px; cursor:pointer; flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; }
  .item.done .chk { background:var(--ok); border-color:var(--ok); }
  .item.dragging { opacity:.6; box-shadow:0 0 0 2px var(--primary); z-index:5; }
  .item-main { flex:1; min-width:0; }
  .item-title { font-weight:600; word-break:break-word; }
  .item-meta { font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .cat-dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .cat-pill { display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:2px 8px; border-radius:999px; background:var(--primary-soft); color:var(--primary); }
  .prio { font-size:11px; padding:1px 7px; border-radius:6px; font-weight:700; }
  .prio-high { background:#ffe3e3; color:#e03131; } .prio-mid { background:#fff3bf; color:#f08c00; } .prio-low { background:#e6fcf5; color:#0ca678; }
  body.dark .prio-high{background:#3a2226;color:#ff8787} body.dark .prio-mid{background:#3a3320;color:#ffd43b} body.dark .prio-low{background:#1c352e;color:#63e6be}
  .item-actions { display:flex; gap:5px; flex-shrink:0; }
  .empty { text-align:center; color:var(--muted); padding:36px 16px; font-size:14px; }
  .todo-done { margin-top:18px; }
  .done-section { margin-top:6px; border-top:1px dashed var(--border); padding-top:8px; }
  .done-head { display:flex; align-items:center; justify-content:space-between; cursor:pointer; padding:8px 4px; font-size:14px; font-weight:700; color:var(--muted); user-select:none; }
  .done-head:hover { color:var(--text); }
  .done-caret { font-size:13px; }
  .done-head-left { display:inline-flex; align-items:center; gap:6px; }
  .done-head .mini.ghost { pointer-events:auto; }
  .done-section.collapsed .done-caret { transform:rotate(0deg); }
  .form-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:var(--shadow); margin-bottom:14px; }
  .form-title { font-size:16px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:7px; }
  .form-actions { display:flex; gap:8px; margin-top:6px; }
  .cat-head { display:flex; gap:8px; align-items:center; }
  .cat-head input[type=color] { width:42px; height:38px; padding:2px; border-radius:10px; border:1px solid var(--border); flex-shrink:0; }
  .cat-manage { border:1px solid var(--border); border-radius:12px; padding:12px; margin-top:8px; display:none; }
  .cat-manage.show { display:block; }
  .cat-row { display:flex; align-items:center; gap:8px; padding:6px 0; }
  .cat-row .name { flex:1; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .cal-head .cal-center { flex:1; display:flex; align-items:center; justify-content:center; gap:8px; }
  .cal-head .cal-nav { display:flex; align-items:center; gap:4px; }
  .cal-head .cal-nav button { border:1px solid var(--border); background:var(--card); border-radius:9px; width:34px; height:34px; cursor:pointer; color:var(--text); font-size:16px; flex-shrink:0; }
  .cal-today-btn { border:1px solid var(--border); background:var(--card); border-radius:11px; padding:11px 20px; cursor:pointer; color:var(--text); font-size:15px; font-weight:700; white-space:nowrap; flex-shrink:0; }
  .cal-today-btn:hover { border-color:var(--primary); color:var(--primary); }
  .cal-jump-row { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .cal-title { font-size:16px; font-weight:700; }
  .cal-subtabs { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; flex:1; }
  .cal-subtabs .subtab { font-size:16px; padding:10px 18px; min-width:64px; }
  .cal-subtabs .subtab.active { background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:0 2px 8px rgba(76,110,245,.28); }
  .cal-week { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-cell { aspect-ratio:1/1; border:1px solid var(--border); border-radius:10px; padding:5px 4px; font-size:12px; cursor:pointer; background:var(--card); display:flex; flex-direction:column; overflow:hidden; position:relative; }
  .cal-cell:hover { border-color:var(--primary); }
  .cal-cell.muted { opacity:.4; }
  .cal-cell.today { border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft); }
  .cal-cell.important { background:#fff8e6; }
  body.dark .cal-cell.important { background:#3a3320; }
  .cal-cell .d { font-weight:600; }
  .cal-cell .dots { display:flex; gap:2px; flex-wrap:wrap; margin-top:2px; }
  .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .cal-detail { display:none; }
  .cal-detail.show { display:block; }
  .entry { display:flex; align-items:flex-start; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); }
  .entry:last-child { border-bottom:none; }
  .entry-type { font-size:11px; padding:1px 7px; border-radius:6px; flex-shrink:0; margin-top:2px; }
  .t-node { background:var(--primary-soft); color:var(--primary); }
  .t-note { background:#e6fcf5; color:#0ca678; }
  body.dark .t-note{background:#134e44;color:#63e6be}
  .t-deadline { background:#ffe3e3; color:#e03131; }
  body.dark .t-deadline{background:#3a2226;color:#ff8787}
  .t-year { background:#f3e8ff; color:#7048e8; }
  body.dark .t-year{background:#3a2a5e;color:#b197fc}
  .entry-text { flex:1; word-break:break-word; }
  .entry .mini { flex-shrink:0; }
  .year-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .ym { border:1px solid var(--border); border-radius:12px; padding:8px; }
  .ym-title { font-size:12px; font-weight:700; text-align:center; margin-bottom:5px; }
  .ym-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; }
  .ym-cell { text-align:center; font-size:9px; padding:2px 0; border-radius:3px; }
  .ym-cell.hot { background:var(--primary-soft); color:var(--primary); font-weight:700; }
  .ym-cell.imp { background:#fff3bf; }
  body.dark .ym-cell.imp{background:#3a3320}
  .sum-block { margin-bottom:14px; }
  .sum-block h4 { font-size:14px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .sum-item { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .sum-item:last-child { border-bottom:none; }
  .ck-today { text-align:center; padding:6px 0 14px; }
  .ck-today .date { font-size:14px; color:var(--muted); }
  .ck-today .big { font-size:30px; font-weight:800; margin:6px 0; }
  .ck-habit-row { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .ck-habit-row:last-child { border-bottom:none; }
  .ck-dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .ck-name { font-weight:600; flex:1; }
  .ck-sub { font-size:12px; color:var(--muted); }
  .ck-actions { display:flex; gap:5px; flex-shrink:0; }
  .ck-done { width:34px; height:34px; border-radius:50%; border:2px solid var(--border); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--muted); flex-shrink:0; background:var(--card); }
  .ck-done.on { background:var(--ok); border-color:var(--ok); color:#fff; }
  .heat { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .heat-cell { aspect-ratio:1/1; border-radius:5px; background:var(--border); cursor:pointer; }
  .heat-cell.l1 { background:#b2f2e6; } .heat-cell.l2 { background:#63e6be; } .heat-cell.l3 { background:#20c997; } .heat-cell.l4 { background:#0ca678; }
  body.dark .heat-cell.l1{background:#155e54} body.dark .heat-cell.l2{background:#0c8a75} body.dark .heat-cell.l3{background:#0a9b74} body.dark .heat-cell.l4{background:#12b886}
  .heat-legend { font-size:11px; color:var(--muted); margin-top:6px; display:flex; gap:4px; align-items:center; }
  .info-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:var(--shadow); }
  .info-card-head { display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .info-title { font-weight:700; flex:1; word-break:break-word; }
  .info-actions { display:flex; gap:5px; }
  .info-field { display:flex; align-items:center; gap:8px; padding:5px 0; font-size:14px; }
  .if-label { font-size:12px; color:var(--muted); width:38px; flex-shrink:0; }
  .if-val { flex:1; word-break:break-all; }
  .copy-btn { border:none; background:var(--primary-soft); color:var(--primary); border-radius:7px; padding:4px 7px; cursor:pointer; flex-shrink:0; display:inline-flex; align-items:center; }
  .copy-btn:active { transform:scale(.94); }
  .info-note-wrap { display:flex; align-items:flex-start; gap:8px; padding:5px 0; }
  .info-note { flex:1; font-size:13px; color:var(--muted); white-space:pre-wrap; word-break:break-word; }
  .dm-wrap { display:none; }
  .dm-wrap.show { display:block; }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:rgba(31,36,48,.94); color:#fff; padding:10px 18px; border-radius:999px; font-size:14px; z-index:9999; opacity:0; transition:opacity .2s; pointer-events:none; }
  .undo-bar { display:none; position:fixed; left:50%; bottom:130px; transform:translateX(-50%); z-index:9999; background:rgba(31,36,48,.96); color:#fff; padding:10px 12px 10px 18px; border-radius:12px; font-size:14px; align-items:center; gap:14px; box-shadow:0 6px 24px rgba(0,0,0,.28); max-width:92vw; }
  .undo-bar .undo-msg { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .undo-bar .undo-btn { border:1px solid #fff; background:transparent; color:#fff; border-radius:8px; padding:6px 14px; font-weight:700; cursor:pointer; flex-shrink:0; }
  .undo-bar .undo-btn:hover { background:#fff; color:#1f2430; }
  .toast.show { opacity:1; }
  .err-bar { display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#e03131; color:#fff; font-size:13px; padding:10px 14px; line-height:1.45; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  .upd-bar { display:none; position:fixed; top:0; left:0; right:0; z-index:99998; background:var(--ok); color:#fff; font-size:13px; padding:10px 14px; line-height:1.5; box-shadow:0 2px 8px rgba(0,0,0,.25); align-items:center; gap:10px; }
  .upd-bar .upd-close { margin-left:auto; border:none; background:rgba(255,255,255,.22); color:#fff; border-radius:8px; padding:4px 12px; cursor:pointer; flex-shrink:0; font-family:inherit; font-size:13px; }
  .app-ver { text-align:center; color:var(--muted); font-size:12px; margin-top:6px; }
  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9000; display:none; align-items:center; justify-content:center; padding:16px; }
  .modal-mask.show { display:flex; }
  .modal { background:var(--card); border-radius:16px; padding:20px; max-width:340px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .modal h3 { margin-bottom:12px; font-size:17px; }
  .modal p { color:var(--muted); font-size:14px; margin-bottom:16px; }
  .modal-actions { display:flex; gap:8px; }
  @media (max-width:520px){ .tab{ padding:7px 10px; min-width:48px; } .tab .ic{ width:18px; height:18px; } .year-grid{ grid-template-columns:repeat(2,1fr); } .field-row{ flex-direction:column; } .field-row > .field{ width:100%; min-width:0; } }
  /* 分类管理（嵌入编辑栏内） */
  .cat-head { flex-wrap:wrap; }
  .cat-manage-toggle { border:1px solid var(--border); background:var(--card); border-radius:8px; padding:5px 9px; cursor:pointer; font-size:12px; color:var(--muted); font-family:inherit; flex-shrink:0; }
  .cat-manage-toggle:hover { border-color:var(--primary); color:var(--primary); }
  .cat-edit-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--border); }
  .cat-edit-row:last-child { border-bottom:none; }
  .cat-edit-row input[type=text] { flex:1; min-width:0; }
  /* 待办优先级分组 */
  .prio-group { margin-bottom:12px; }
  .prio-group-title { font-size:13px; font-weight:700; margin:6px 2px 8px; display:flex; align-items:center; gap:6px; }
  .prio-group-title .cnt { font-size:11px; color:var(--muted); font-weight:500; }
  /* 打卡月历 */
  .ck-cal-legend { margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .ck-leg-row { display:flex; align-items:center; gap:8px; font-size:12px; }
  .ck-leg-row .name { font-weight:600; flex:1; min-width:0; }
  .ck-leg-row .rng { color:var(--muted); }
  /* 打卡提醒 */
  .ck-reminder { background:var(--primary-soft); border:1px solid var(--primary); border-radius:14px; padding:12px 14px; margin-bottom:12px; }
  .ck-rem-title { font-weight:700; font-size:15px; color:var(--primary); display:flex; align-items:center; gap:6px; }
  .ck-rem-sub { font-size:13px; color:var(--text); margin:7px 0 9px; }
  .ck-rem-chip { display:inline-flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--border); border-radius:999px; padding:4px 11px; margin:0 6px 6px 0; font-size:13px; }
  .cal-cell.hit { box-shadow:0 0 0 2px var(--primary); }
  .cal-cell.dim { opacity:.25; }
  /* 自动备份 */
  .backup-row { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px; border-bottom:1px solid var(--border); }
  .backup-row:last-child { border-bottom:none; }
  .backup-row .bk-date { font-weight:600; flex:1; }
  /* 年视图导航 */
  .year-nav { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:12px; }
  .year-nav button { border:1px solid var(--border); background:var(--card); border-radius:9px; padding:6px 14px; cursor:pointer; color:var(--text); font-size:14px; font-weight:600; }
  .year-nav button:hover { border-color:var(--primary); color:var(--primary); }
  .year-nav .year-label { font-size:18px; font-weight:800; min-width:80px; text-align:center; }
</style>
</head>
<body>
<div id="err-bar" class="err-bar"></div>
<div id="upd-bar" class="upd-bar"></div>
<div class="wrap">
  <header>
    <h1>日程安排</h1>
    <p>随手记录 · 离线可用 · 可编辑 · 可拖拽</p>

<script>
"use strict";
/* ============ 安全存储 ============ */
function storeGet(k, def){ try{ var v=localStorage.getItem(k); return v==null?def:JSON.parse(v); }catch(e){ return def; } }
function storeSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ s=String(s==null?"":s); return s.replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function escAttr(s){ return esc(s); }

/* ============ 图标 ============ */
var ICONS = {
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  flag:'<path d="M4 22V4h13l-2 4 2 4H4"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',

  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  upload:'<path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  star:'<path d="M12 2l3 6.5 7 .9-5 4.8 1.3 7L12 18l-6.3 3.2L7 14.2l-5-4.8 7-.9z"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',

  chevronRight:'<path d="M9 6l6 6-6 6"/>'
};
function svg(name, size){ size=size||20; var p=ICONS[name]||""; return '<svg class="ic" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; }
function fillIcons(root){ var nodes=root.querySelectorAll('[data-i]'); for(var i=0;i<nodes.length;i++){ var n=nodes[i]; if(!n.innerHTML) n.innerHTML=svg(n.getAttribute('data-i')); } }

/* ============ 全局错误条 ============ */
var _errTimer=null;
function showErr(msg){
  /* 过滤非本应用代码的跨域/浏览器内部错误（如微信注入脚本抛出的 Script error） */
  if(!msg || /^script error\.?$/i.test(String(msg).trim())) return;
  try{
    var b=document.getElementById('err-bar');
    if(!b) return;
    b.innerHTML='<span>⚠️ '+esc(msg)+'</span><button style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer;padding:0 0 0 10px;line-height:1;" onclick="this.parentElement.style.display=\'none\'">×</button>';
    b.style.display='block';
    if(_errTimer) clearTimeout(_errTimer);
    _errTimer=setTimeout(function(){ if(b) b.style.display='none'; }, 8000);
  }catch(e){}
}
window.onerror=function(m,src,line,col,err){
  /* 忽略跨域 Script error（通常来自微信/浏览器内置脚本，非本应用代码） */
  if(/^script error\.?$/i.test(String(m).trim())) return false;
  if(src && src.indexOf(location.hostname)<0 && src.indexOf("blob:")!==0 && src.indexOf("data:")!==0) return false;
  try{ showErr(String(m)+' @'+(line||'?')+':'+(col||'?')); }catch(e){} return false;
};
window.onunhandledrejection=function(e){ try{ var r=e&&e.reason; showErr('Promise:'+(r&&r.message?r.message:r)); }catch(x){} };

/* ============ 状态 ============ */

    K_CKCAT="todo.app.ck.cats", K_INFO="todo.app.info", K_INFOCAT="todo.app.info.cats", K_THEME="todo.app.theme";

var calData=storeGet(K_CAL,{}), recur=storeGet(K_RECUR,[]);
var products=storeGet(K_PROD,[]), prodCats=storeGet(K_PRODCAT,[]);

/* ============ 工具 ============ */
function $(id){ return document.getElementById(id); }
function todayKey(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function keyToday(){ return todayKey(); }
function parseKey(k){ var p=String(k).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function fmtKey(k){ if(!k) return ""; var d=parseKey(k); if(isNaN(d.getTime())) return String(k); return (d.getMonth()+1)+"月"+d.getDate()+"日"; }
function daysBetween(a,b){ return Math.round((parseKey(b)-parseKey(a))/86400000); }
function pad(n){ return n<10?"0"+n:""+n; }
function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove("show"); },1600); }
function copyText(txt){ try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){toast("已复制");},function(){fallbackCopy(txt);}); } else { fallbackCopy(txt); } }catch(e){ fallbackCopy(txt); } }
function fallbackCopy(txt){ try{ var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); toast("已复制"); }catch(e){ toast("复制失败"); } }

function renderTodos(){

  var arr=todos.slice();
  if(search){ var q=search.toLowerCase(); arr=arr.filter(function(t){ return (t.text+" "+(t.cat||"")).toLowerCase().indexOf(q)>-1; }); }
  if(!arr.length){ list.innerHTML='<div class="empty">'+(search?"没有匹配的任务":"这里还空空如也～")+'</div>'; doneBox.innerHTML=""; return; }

function sortTodosHTML(arr){
  if(sortMode==="prio"){
    var groups={high:[],mid:[],low:[]};
    arr.forEach(function(t){ var p=t.prio==="high"?"high":t.prio==="mid"?"mid":"low"; groups[p].push(t); });
    var titles=[["high","🔴 高优先级"],["mid","🟡 中优先级"],["low","🟢 低优先级"]];
    return titles.map(function(g){ if(!groups[g[0]].length) return ""; return '<div class="prio-group"><div class="prio-group-title">'+g[1]+' <span class="cnt">'+groups[g[0]].length+' 项</span></div>'+groups[g[0]].map(todoItemHTML).join("")+'</div>'; }).join("");
  }
  if(sortMode==="due"){ arr.sort(function(a,b){ var x=a.due?parseKey(a.due):new Date(9999,0,1); var y=b.due?parseKey(b.due):new Date(9999,0,1); return x-y; }); }
  else if(sortMode==="created"){ arr.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); }); }
  else { arr.sort(function(a,b){ return (a.order||0)-(b.order||0); }); }
  return arr.map(todoItemHTML).join("");
}

var HABIT_COLORS=["#e03131","#f08c00","#fab005","#12b886","#0ca678","#1098ad","#1c7ed4","#4c6ef5","#7950f2","#be4bdb","#e64980","#a93670"];
function nextHabitColor(){
  var used=habits.map(function(h){return h.color;});
  for(var i=0;i<HABIT_COLORS.length;i++){ if(used.indexOf(HABIT_COLORS[i])===-1) return HABIT_COLORS[i]; }
  // all used, pick random
  return HABIT_COLORS[Math.floor(Math.random()*HABIT_COLORS.length)];
}
/* Ensure every habit has a unique color; fix legacy data where all defaulted to #4c6ef5 */
function ensureHabitColors(){
  if(!habits.length) return;
  var assigned=[];
  for(var i=0;i<habits.length;i++){
    var h=habits[i];
    if(!h.color) h.color=nextHabitColor();
    else if(assigned.indexOf(h.color)!==-1){
      // duplicate — pick a new one
      var nc=nextHabitColor();
      // temporarily add to assigned so nextHabitColor skips it
      assigned.push(h.color);
      h.color=nc;
    }
    assigned.push(h.color);
  }
  storeSet(K_CKH,habits);
}

function exportData(){ var scope=$("export-scope").value; var keys; if(scope==="all") keys=[K_TODO,K_TODOCAT,K_CAL,K_RECUR,K_PROD,K_PRODCAT,K_CKH,K_CKR,K_CKCAT,K_INFO,K_INFOCAT]; else if(scope==="todo") keys=[K_TODO,K_TODOCAT]; else if(scope==="calendar") keys=[K_CAL,K_RECUR]; else if(scope==="checkin") keys=[K_CKH,K_CKR,K_CKCAT]; else if(scope==="info") keys=[K_INFO,K_INFOCAT];
  var out={}; for(var i=0;i<keys.length;i++){ if(keys[i]) out[keys[i]]=storeGet(keys[i],keys[i].indexOf("cats")>-1?[]:null); }
  var blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"}); var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="todo-backup-"+todayKey()+".json"; a.click(); toast("已导出"); }
function importData(file){ var reader=new FileReader(); reader.onload=function(){ try{ var data=JSON.parse(reader.result); var n=0; for(var k in data){ if(k.indexOf("todo.app")===0){ storeSet(k,data[k]); n++; } } toast("已导入 "+n+" 项，重新加载"); setTimeout(function(){ location.reload(); },400); }catch(e){ toast("导入失败：文件格式错误"); } }; reader.readAsText(file); }
function exportICS(){
  try{
    var lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//日程安排//ZH//CN","CALSCALE:GREGORIAN"];
    function dt(v){ return String(v||"").replace(/-/g,""); }
    function escICS(s){ return String(s==null?"":s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
    todos.forEach(function(t){ if(t.due){ lines.push("BEGIN:VEVENT"); lines.push("UID:todo-"+t.id+"@rili"); lines.push("DTSTAMP:"+dt(todayKey())+"T000000Z"); lines.push("DTSTART;VALUE=DATE:"+dt(t.due)); lines.push("SUMMARY:"+escICS(t.text)); lines.push("END:VEVENT"); } });
    habits.forEach(function(h){ if(h.start||h.end){ lines.push("BEGIN:VEVENT"); lines.push("UID:habit-"+h.id+"@rili"); lines.push("DTSTAMP:"+dt(todayKey())+"T000000Z"); lines.push("SUMMARY:"+escICS(h.name)); var r="FREQ=DAILY"; if(h.end) r+=";UNTIL="+dt(h.end); lines.push("RRULE:"+r); lines.push("DTSTART;VALUE=DATE:"+(h.start?dt(h.start):dt(todayKey()))); lines.push("END:VEVENT"); } });
    lines.push("END:VCALENDAR");
    var blob=new Blob([lines.join("\r\n")],{type:"text/calendar"}); var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="日程安排-"+todayKey()+".ics"; a.click(); toast("已导出日历(.ics)");
  }catch(e){ toast("导出日历失败"); }
}

/* ============ 自动备份（每月一次） ============ */
function autoBackup(){
  try{
    var now=new Date(); var ym=now.getFullYear()+"-"+pad(now.getMonth()+1);
    var last=storeGet("todo.app.lastBackup","");
    if(last===ym) return;
    var keys=[K_TODO,K_TODOCAT,K_CAL,K_RECUR,K_PROD,K_PRODCAT,K_CKH,K_CKR,K_CKCAT,K_INFO,K_INFOCAT];
    var snap={ts:Date.now(),data:{}};
    keys.forEach(function(k){ snap.data[k]=storeGet(k, k.indexOf("cats")>-1?[]:null); });
    storeSet("todo.app.backup."+ym, snap);
    var all=[]; for(var i=0;i<localStorage.length;i++){ var kk=localStorage.key(i); if(kk&&kk.indexOf("todo.app.backup.")===0) all.push(kk); }
    all.sort(); while(all.length>3){ localStorage.removeItem(all.shift()); }
    storeSet("todo.app.lastBackup", ym);
    toast("已自动备份（"+ym+"）");
  }catch(e){}
}
function renderBackups(){
  var box=$("backup-list"); if(!box) return;
  var all=[]; for(var i=0;i<localStorage.length;i++){ var kk=localStorage.key(i); if(kk&&kk.indexOf("todo.app.backup.")===0) all.push(kk); }
  all.sort().reverse();
  if(!all.length){ box.innerHTML='<div class="ck-sub">暂无自动备份。</div>'; return; }
  box.innerHTML=all.map(function(kk){ var ym=kk.replace("todo.app.backup.",""); return '<div class="backup-row"><span class="bk-date">'+esc(ym)+'</span><button class="btn btn-sm" data-dl="'+escAttr(kk)+'">下载</button><button class="btn btn-sm" data-bk="'+escAttr(kk)+'">恢复</button></div>'; }).join("");
}
function restoreBackup(kk){ var snap=storeGet(kk,null); if(!snap||!snap.data){ toast("备份无效"); return; } confirmDialog("恢复备份","恢复会将当前数据覆盖为该备份（"+kk.replace("todo.app.backup.","")+"）。建议先导出当前数据。",function(){ for(var k in snap.data){ storeSet(k,snap.data[k]); } toast("已恢复，重新加载"); setTimeout(function(){ location.reload(); },400); }); }
function downloadBackup(kk){ var snap=storeGet(kk,null); if(!snap||!snap.data){ toast("备份不存在"); return; } var ym=kk.replace("todo.app.backup.",""); var blob=new Blob([JSON.stringify(snap.data,null,2)],{type:"application/json"}); var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="todo-backup-"+ym+".json"; a.click(); toast("已下载备份（"+ym+"）"); }

/* ============ 移动端触摸拖拽 ============ */
var touchDrag=null;
function initTouchDrag(){
  if(!("ontouchstart" in window)) return;
  var list=$("todo-list"); if(!list) return;
  list.addEventListener("touchstart",function(e){
    if(touchDrag&&touchDrag.active) return;
    if(sortMode!=="manual") return;
    if(e.target.closest("button")) return;
    var li=e.target.closest(".item"); if(!li) return;
    var id=li.getAttribute("data-id");
    touchDrag={ id:id, el:li, startX:e.touches[0].clientX, startY:e.touches[0].clientY, timer:null, active:false };
    touchDrag.timer=setTimeout(function(){ if(touchDrag){ touchDrag.active=true; li.classList.add("dragging"); document.body.style.overflow="hidden"; } },350);
  },{passive:true});
  list.addEventListener("touchmove",function(e){
    if(!touchDrag||!touchDrag.active){
      if(touchDrag&&!touchDrag.active){ var dx=e.touches[0].clientX-touchDrag.startX, dy=e.touches[0].clientY-touchDrag.startY; if(Math.abs(dx)>8||Math.abs(dy)>8){ clearTimeout(touchDrag.timer); touchDrag=null; } }
      return;
    }
    e.preventDefault();
    var y=e.touches[0].clientY;
    var items=Array.prototype.slice.call(list.querySelectorAll(".item"));
    var after=null;
    for(var i=0;i<items.length;i++){ var r=items[i].getBoundingClientRect(); if(y<r.top+r.height/2){ after=items[i]; break; } }
    if(after&&after!==touchDrag.el) list.insertBefore(touchDrag.el,after);
    else if(!after) list.appendChild(touchDrag.el);
  },{passive:false});
  function endDrag(){ if(!touchDrag) return; clearTimeout(touchDrag.timer); if(touchDrag.active){ touchDrag.el.classList.remove("dragging"); document.body.style.overflow=""; var ids=Array.prototype.slice.call(list.querySelectorAll(".item")).map(function(li){return li.getAttribute("data-id");}); var om={}; ids.forEach(function(id,idx){ om[id]=idx+1; }); todos.forEach(function(t){ if(om[t.id]!=null) t.order=om[t.id]; }); storeSet(K_TODO,todos); renderTodos(); } touchDrag=null; }
  list.addEventListener("touchend",endDrag,{passive:true});
  list.addEventListener("touchcancel",endDrag,{passive:true});
}

  $("info-list").addEventListener("click",function(e){ var rv=e.target.closest("[data-reveal]"); if(rv){ var id=rv.getAttribute("data-reveal"); var o=null; for(var i=0;i<infos.length;i++){ if(infos[i].id===id) o=infos[i]; } if(o){ rv.parentNode.querySelector(".if-val").textContent=(rv.parentNode.querySelector(".if-val").textContent===masked(o.password))?o.password:masked(o.password); } return; } var cp=e.target.closest("[data-copy]"); if(cp){ copyText(cp.getAttribute("data-copy")); return; } var ed=e.target.closest("[data-iedit]"); if(ed){ var eid=ed.getAttribute("data-iedit"); var io=null; for(var j=0;j<infos.length;j++){ if(infos[j].id===eid) io=infos[j]; } if(io) openInfoForm(io); } var dl=e.target.closest("[data-idel]"); if(dl){ var did=dl.getAttribute("data-idel"); var iitem=null,iidx=-1; for(var ii=0;ii<infos.length;ii++){ if(infos[ii].id===did){ iitem=infos[ii]; iidx=ii; break; } } if(!iitem) return; confirmDialog("删除条目","确定删除这条记录？删除后可在提示里撤销。",function(){ var snap=iitem,snapIdx=iidx; infos=infos.filter(function(x){return x.id!==did;}); storeSet(K_INFO,infos); renderInfos(); undoFn=function(){ infos.splice(Math.min(snapIdx,infos.length),0,snap); storeSet(K_INFO,infos); renderInfos(); }; showUndo("已删除「"+(snap.title||"记录")+"」"); }); } });
  bindCatManager("info");

  // 数据管理
  $("dm-toggle").onclick=function(){ $("data-mgmt-wrap").classList.toggle("show"); if($("data-mgmt-wrap").classList.contains("show")) renderBackups(); };
  $("export-btn").onclick=exportData;
  $("export-ics-btn").onclick=exportICS;
  $("import-btn").onclick=function(){ $("import-file").click(); };
  $("import-file").addEventListener("change",function(e){ if(e.target.files&&e.target.files[0]) importData(e.target.files[0]); });
  $("backup-now-btn").onclick=function(){ autoBackup(); renderBackups(); };
  $("backup-list").addEventListener("click",function(e){ var dl=e.target.closest("[data-dl]"); if(dl){ downloadBackup(dl.getAttribute("data-dl")); return; } var b=e.target.closest("[data-bk]"); if(b) restoreBackup(b.getAttribute("data-bk")); });

  // 主题
  $("theme-toggle").onclick=function(){ curTheme=curTheme==="dark"?"light":"dark"; storeSet(K_THEME,curTheme); applyTheme(curTheme); };
}

/* ============ 启动 ============ */
try{ bind(); fillIcons(document); ensureHabitColors(); autoBackup(); renderBackups(); renderTodoCats(); renderTodos(); checkUpdate(); if(storeGet("todo.app.lastDigest","")!==todayKey()){ storeSet("todo.app.lastDigest",todayKey()); showDigest(); } if($("app-ver")) $("app-ver").textContent="v"+APP_VERSION+" · 数据存于本机，清理浏览器会丢失，建议常备份"; }catch(e){ showErr("初始化失败："+e.message); }
</script>
